name: Reusable AWS CDK deployment

on:
  workflow_call:
    inputs:
      enabled:
        description: "Whether the CI/CD configuration permits this AWS operation."
        required: true
        type: boolean
      operation:
        description: "CDK command to run: diff or deploy."
        required: true
        type: string
      stack-name:
        description: "Target shared CDK stack name; previews are resolved from preview-branch."
        required: false
        type: string
        default: ""
      preview-branch:
        description: "PR source branch used by the shared preview stack naming function."
        required: false
        type: string
        default: ""
      stack-environment:
        description: "CDK context environment, such as development or pr-123 (tag identity)."
        required: true
        type: string
      region:
        description: "AWS region for the target stack."
        required: true
        type: string
      github-environment:
        description: "GitHub Environment used for approvals and environment secrets."
        required: true
        type: string
      source-ref:
        description: "Immutable source commit for a preview operation."
        required: false
        type: string
        default: ""
      expected-pr-state:
        description: "Required PR state before each preview AWS operation."
        required: false
        type: string
        default: ""
    secrets:
      AWS_ROLE_TO_ASSUME:
        description: "OIDC role ARN. A same-named Environment Secret takes precedence."
        required: false

jobs:
  cdk:
    if: inputs.enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.github-environment }}
    steps:
      - name: Reject unsupported operation
        if: inputs.operation != 'diff' && inputs.operation != 'deploy'
        run: exit 1
      - name: Confirm pull request is current before checkout
        if: inputs.expected-pr-state != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_STATE: ${{ inputs.expected-pr-state }}
          SOURCE_REF: ${{ inputs.source-ref }}
          PREVIEW_BRANCH: ${{ inputs.preview-branch }}
        run: |
          pr="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}")"
          [[ "$(jq -r .state <<<"$pr")" == "$EXPECTED_STATE" ]]
          [[ "$(jq -r .head.sha <<<"$pr")" == "$SOURCE_REF" ]]
          [[ "$(jq -r .head.ref <<<"$pr")" == "$PREVIEW_BRANCH" ]]
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Resolve target stack
        id: target
        env:
          PREVIEW_BRANCH: ${{ inputs.preview-branch }}
          EXPECTED_STATE: ${{ inputs.expected-pr-state }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STACK_ENVIRONMENT: ${{ inputs.stack-environment }}
          SHARED_STACK_NAME: ${{ inputs.stack-name }}
        run: |
          if [[ -n "$EXPECTED_STATE" ]]; then
            [[ "$EXPECTED_STATE" == open && "$STACK_ENVIRONMENT" == "pr-$PR_NUMBER" ]]
            stack_name="$(python .github/scripts/preview_cleanup.py stack-name --branch "$PREVIEW_BRANCH")"
          else
            [[ "$STACK_ENVIRONMENT" =~ ^(development|staging|production)$ ]]
            [[ "$SHARED_STACK_NAME" == "app-$STACK_ENVIRONMENT" ]]
            stack_name="$SHARED_STACK_NAME"
          fi
          echo "stack_name=$stack_name" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Confirm pull request is current before AWS operation
        if: inputs.expected-pr-state != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_STATE: ${{ inputs.expected-pr-state }}
          SOURCE_REF: ${{ inputs.source-ref }}
          PREVIEW_BRANCH: ${{ inputs.preview-branch }}
        run: |
          pr="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}")"
          [[ "$(jq -r .state <<<"$pr")" == "$EXPECTED_STATE" ]]
          [[ "$(jq -r .head.sha <<<"$pr")" == "$SOURCE_REF" ]]
          [[ "$(jq -r .head.ref <<<"$pr")" == "$PREVIEW_BRANCH" ]]
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.region }}
      - name: Verify preview stack ownership before diff or deploy
        if: inputs.expected-pr-state != ''
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          PREVIEW_BRANCH: ${{ inputs.preview-branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REGION: ${{ inputs.region }}
        run: |
          python .github/scripts/preview_cleanup.py verify \
            --branch "$PREVIEW_BRANCH" --pull-request "$PR_NUMBER" --region "$REGION"
      - name: Confirm pull request is current immediately before CDK
        if: inputs.expected-pr-state != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_STATE: ${{ inputs.expected-pr-state }}
          SOURCE_REF: ${{ inputs.source-ref }}
          PREVIEW_BRANCH: ${{ inputs.preview-branch }}
        run: |
          pr="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}")"
          [[ "$(jq -r .state <<<"$pr")" == "$EXPECTED_STATE" ]]
          [[ "$(jq -r .head.sha <<<"$pr")" == "$SOURCE_REF" ]]
          [[ "$(jq -r .head.ref <<<"$pr")" == "$PREVIEW_BRANCH" ]]
      - name: Run CDK operation
        env:
          CDK_DEFAULT_REGION: ${{ inputs.region }}
          STACK_NAME: ${{ steps.target.outputs.stack_name }}
          STACK_ENVIRONMENT: ${{ inputs.stack-environment }}
          PREVIEW_BRANCH: ${{ inputs.preview-branch }}
          EXPECTED_STATE: ${{ inputs.expected-pr-state }}
          OPERATION: ${{ inputs.operation }}
        run: |
          cdk_args=("$STACK_NAME" --context "environment=$STACK_ENVIRONMENT")
          if [[ -n "$EXPECTED_STATE" ]]; then
            cdk_args+=(--context "previewBranch=$PREVIEW_BRANCH")
          fi
          if [[ "$OPERATION" == diff ]]; then
            npm run cdk -- diff "${cdk_args[@]}" --no-color
          else
            npm run cdk -- deploy "${cdk_args[@]}" --require-approval never
          fi
  skipped:
    if: ${{ !inputs.enabled }}
    runs-on: ubuntu-24.04
    steps:
      - name: Publish skipped operation
        run: echo 'AWS CDK operation skipped because this deployment path is disabled.' >> "$GITHUB_STEP_SUMMARY"
