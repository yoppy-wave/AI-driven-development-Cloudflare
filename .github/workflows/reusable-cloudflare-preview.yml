name: Reusable Cloudflare preview

on:
  workflow_call:
    inputs:
      enabled:
        required: true
        type: boolean
      operation:
        description: deploy or delete
        required: true
        type: string
      project-path:
        required: true
        type: string
      source-ref:
        description: PR head SHA for deploy; trusted management SHA for delete.
        required: true
        type: string
      preview-branch:
        required: true
        type: string
      pr-number:
        required: true
        type: string
      hosting-provider:
        required: true
        type: string
      pages-project-name:
        required: true
        type: string
      pages-output-directory:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  preview:
    if: inputs.enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preview
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Preview対象をチェックアウト
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Validate Workers Preview inputs
        if: inputs.hosting-provider == 'workers'
        env:
          OPERATION: ${{ inputs.operation }}
          PROJECT_PATH: ${{ inputs.project-path }}
          PREVIEW_BRANCH: ${{ inputs.preview-branch }}
        run: python .github/scripts/cloudflare_preview.py validate
      - name: Validate Pages Preview inputs
        if: inputs.hosting-provider == 'pages'
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
          PAGES_PROJECT_NAME: ${{ inputs.pages-project-name }}
          PAGES_OUTPUT_DIRECTORY: ${{ inputs.pages-output-directory }}
        run: python .github/scripts/cloudflare_pages.py validate
      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked application dependencies
        if: inputs.hosting-provider == 'workers' || inputs.operation == 'deploy'
        working-directory: ${{ inputs.project-path }}
        run: npm ci
      - name: Build preview application
        if: inputs.operation == 'deploy'
        working-directory: ${{ inputs.project-path }}
        run: npm run build --if-present
      - name: Check current PR and run Workers Preview operation
        if: inputs.hosting-provider == 'workers'
        env:
          OPERATION: ${{ inputs.operation }}
          PROJECT_PATH: ${{ inputs.project-path }}
          PREVIEW_BRANCH: ${{ inputs.preview-branch }}
          SOURCE_REF: ${{ inputs.source-ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python .github/scripts/cloudflare_preview.py run
      - name: Check current PR and deploy Pages Preview
        if: inputs.hosting-provider == 'pages' && inputs.operation == 'deploy'
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
          PAGES_PROJECT_NAME: ${{ inputs.pages-project-name }}
          PAGES_OUTPUT_DIRECTORY: ${{ inputs.pages-output-directory }}
          SOURCE_REF: ${{ inputs.source-ref }}
          PREVIEW_BRANCH: ${{ inputs.preview-branch }}
          PR_NUMBER: ${{ inputs.pr-number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python .github/scripts/cloudflare_pages.py preview
      - name: Explain Pages Preview cleanup limitation
        if: inputs.hosting-provider == 'pages' && inputs.operation == 'delete'
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
          PAGES_PROJECT_NAME: ${{ inputs.pages-project-name }}
          PAGES_OUTPUT_DIRECTORY: ${{ inputs.pages-output-directory }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: python .github/scripts/cloudflare_pages.py cleanup
