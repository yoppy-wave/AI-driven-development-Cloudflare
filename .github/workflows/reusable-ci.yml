name: Reusable CI

on:
  workflow_call:
    outputs:
      cdk-enabled:
        description: Validated cdk-enabled after all quality gates succeed.
        value: ${{ jobs.ci.outputs.cdk-enabled }}
      cdk-region:
        description: Validated cdk-region after all quality gates succeed.
        value: ${{ jobs.ci.outputs.cdk-region }}
      preview-environment-enabled:
        description: Validated preview-environment-enabled after all quality gates succeed.
        value: ${{ jobs.ci.outputs.preview-environment-enabled }}
      development-enabled:
        description: Validated development-enabled after all quality gates succeed.
        value: ${{ jobs.ci.outputs.development-enabled }}
      staging-enabled:
        description: Validated staging-enabled after all quality gates succeed.
        value: ${{ jobs.ci.outputs.staging-enabled }}
      production-enabled:
        description: Validated production-enabled after all quality gates succeed.
        value: ${{ jobs.ci.outputs.production-enabled }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
    outputs:
      python-version: ${{ steps.python.outputs.python-version }}
      node-version: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read runtime selectors
        id: policy
        run: |
          python -c 'import json; p=json.load(open(".github/quality/version-policy.json")); print("python="+p["runtimes"]["python"]["series"]); print("node="+p["runtimes"]["node"]["series"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ steps.policy.outputs.python }}
          check-latest: true
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: ${{ steps.policy.outputs.node }}
          check-latest: true
          cache: npm
      - name: Run test gate
        id: check
        run: |
          python .github/scripts/run_regression.py

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    outputs:
      python-version: ${{ steps.python.outputs.python-version }}
      node-version: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read runtime selectors
        id: policy
        run: |
          python -c 'import json; p=json.load(open(".github/quality/version-policy.json")); print("python="+p["runtimes"]["python"]["series"]); print("node="+p["runtimes"]["node"]["series"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ steps.policy.outputs.python }}
          check-latest: true
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: ${{ steps.policy.outputs.node }}
          check-latest: true
          cache: npm
      - name: Run lint gate
        id: check
        run: |
          python .github/scripts/run_lint.py

  dependency:
    name: Dependency
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
    outputs:
      python-version: ${{ steps.python.outputs.python-version }}
      node-version: ${{ steps.node.outputs.node-version }}
      required-python: ${{ steps.check.outputs.required-python }}
      required-node: ${{ steps.check.outputs.required-node }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read runtime selectors
        id: policy
        run: |
          python -c 'import json; p=json.load(open(".github/quality/version-policy.json")); print("python="+p["runtimes"]["python"]["series"]); print("node="+p["runtimes"]["node"]["series"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ steps.policy.outputs.python }}
          check-latest: true
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: ${{ steps.policy.outputs.node }}
          check-latest: true
          cache: npm
      - name: Run dependency gate
        id: check
        run: |
          python .github/scripts/check_dependencies.py

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    outputs:
      python-version: ${{ steps.python.outputs.python-version }}
      node-version: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read runtime selectors
        id: policy
        run: |
          python -c 'import json; p=json.load(open(".github/quality/version-policy.json")); print("python="+p["runtimes"]["python"]["series"]); print("node="+p["runtimes"]["node"]["series"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ steps.policy.outputs.python }}
          check-latest: true
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: ${{ steps.policy.outputs.node }}
          check-latest: true
          cache: npm
      - name: Run security gate
        id: check
        run: |
          npm ci --ignore-scripts
          python .github/scripts/check_security.py

  ci:
    if: always()
    needs: [test, lint, dependency, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cdk-enabled: ${{ steps.config.outputs.cdk_enabled }}
      cdk-region: ${{ steps.config.outputs.cdk_region }}
      preview-environment-enabled: ${{ steps.config.outputs.preview_environment_enabled }}
      development-enabled: ${{ steps.config.outputs.development_enabled }}
      staging-enabled: ${{ steps.config.outputs.staging_enabled }}
      production-enabled: ${{ steps.config.outputs.production_enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every quality gate and runtime
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: python .github/scripts/quality_gate.py
      - name: Validate and publish deployment configuration
        id: config
        run: python .github/scripts/cicd_config.py github-output >> "$GITHUB_OUTPUT"
