# @STATE@ and @ALLOWLIST@ are local paths filled by dev-proxy.
http_port 127.0.0.1:3128
visible_hostname devcontainer-squid
acl local_client src 127.0.0.1/32
acl http_ports port 80
acl ssl_ports port 443
acl connect_method method CONNECT
# -n avoids reverse DNS turning an IP-literal request into an allowed domain.
acl allowed_domains dstdomain -n @ALLOWLIST@
http_access deny !local_client
http_access deny connect_method !ssl_ports
http_access deny !connect_method !http_ports
http_access allow allowed_domains
http_access deny all

cache deny all
cache_store_log none
cache_mem 0 MB
maximum_object_size 0 KB
netdb_filename none
pinger_enable off
icp_port 0
htcp_port 0
forwarded_for delete
via off
shutdown_lifetime 1 seconds
pid_filename @STATE@/squid.pid
coredump_dir @STATE@

# No URL path, query, userinfo, username, request/response headers, or body.
logformat host_only %ts.%03tu %>rd %>rP %Ss/%03>Hs
access_log stdio:@STATE@/access.log host_only
buffered_logs off
logfile_rotate 3
# Raw Squid diagnostics can contain request URLs. The supervisor classifies
# stderr into fixed safe messages in cache.log instead of persisting raw text.
cache_log /dev/null
debug_options ALL,1
